name: build

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-amd64
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            name: windows-amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}" --bin pow

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          extension=""
          if [[ "${{ matrix.os }}" == windows-* ]]; then extension=".exe"; fi
          cp "target/${{ matrix.target }}/release/pow${extension}" "out/pow-${{ matrix.name }}${extension}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  build-linux-glibc:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            name: linux-amd64
            machine: Advanced Micro Devices X86-64
            qemu: false
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            name: linux-arm64
            machine: AArch64
            qemu: false
          - os: ubuntu-24.04
            platform: linux/ppc64le
            name: linux-ppc64le
            machine: PowerPC64
            qemu: true
    steps:
      - uses: actions/checkout@v7

      - name: Enable QEMU for PPC64LE
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ppc64le

      - name: Build in Red Hat UBI 10
        shell: bash
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e RELEASE_NAME="${{ matrix.name }}" \
            -e EXPECTED_MACHINE="${{ matrix.machine }}" \
            registry.access.redhat.com/ubi10/ubi:latest bash -euo pipefail -c '
              dnf -y install rust cargo gcc gcc-c++ make glibc-devel binutils
              rustc -vV
              cargo build --release --bin pow
              readelf -h target/release/pow | grep -F "$EXPECTED_MACHINE"
              mkdir -p out
              cp target/release/pow "out/pow-$RELEASE_NAME"
            '

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/pow-${{ matrix.name }}
          if-no-files-found: error

  build-linux-i386:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build in AlmaLinux 10 i686 container
        run: |
          docker run --rm \
            --platform linux/386 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            almalinux:10 bash -euo pipefail -c '
              dnf -y install rust cargo gcc make glibc-devel binutils
              rustc -vV
              cargo build --release --bin pow
              readelf -h target/release/pow | grep -E "Machine:.*80386"
              mkdir -p out
              cp target/release/pow out/pow-linux-i386
            '

      - uses: actions/upload-artifact@v7
        with:
          name: linux-i386
          path: out/pow-linux-i386
          if-no-files-found: error

  build-linux-riscv64-glibc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cross compile RISC-V64 glibc in Red Hat UBI 10
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            registry.access.redhat.com/ubi10/ubi:latest bash -euo pipefail -c '
              dnf -y install curl ca-certificates gcc gcc-c++ make tar xz binutils
              curl --fail --location --retry 3 --output /tmp/zig.tar.xz \
                https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
              mkdir -p /opt/zig
              tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
              export PATH="/opt/zig:$HOME/.cargo/bin:$PATH"
              zig version
              curl --fail --location --retry 3 https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              rustup target add riscv64gc-unknown-linux-gnu
              cargo install cargo-zigbuild --locked
              cargo zigbuild --release \
                --target riscv64gc-unknown-linux-gnu.2.39 --bin pow
              binary=target/riscv64gc-unknown-linux-gnu/release/pow
              readelf -h "$binary" | grep -F "RISC-V"
              mkdir -p out
              cp "$binary" out/pow-linux-riscv64
            '

      - uses: actions/upload-artifact@v7
        with:
          name: linux-riscv64
          path: out/pow-linux-riscv64
          if-no-files-found: error

  build-linux-musl:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            name: linux-amd64-musl
            machine: Advanced Micro Devices X86-64
            qemu: false
          - os: ubuntu-24.04
            platform: linux/386
            name: linux-i386-musl
            machine: Intel 80386
            qemu: false
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            name: linux-arm64-musl
            machine: AArch64
            qemu: false
          - os: ubuntu-24.04
            platform: linux/riscv64
            name: linux-riscv64-musl
            machine: RISC-V
            qemu: true
          - os: ubuntu-24.04
            platform: linux/ppc64le
            name: linux-ppc64le-musl
            machine: PowerPC64
            qemu: true
    steps:
      - uses: actions/checkout@v7

      - name: Enable QEMU for non-native Alpine
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64,ppc64le

      - name: Build in Alpine 3.22
        shell: bash
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e RELEASE_NAME="${{ matrix.name }}" \
            -e EXPECTED_MACHINE="${{ matrix.machine }}" \
            alpine:3.22 sh -ec '
              apk add --no-cache build-base cargo rust binutils
              rustc -vV
              cargo build --release --bin pow
              readelf -h target/release/pow | grep -F "$EXPECTED_MACHINE"
              mkdir -p out
              cp target/release/pow "out/pow-$RELEASE_NAME"
              chmod +x "out/pow-$RELEASE_NAME"
            '

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/pow-${{ matrix.name }}
          if-no-files-found: error

  build-windows-i386:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Enable MSVC x86 tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build
        shell: pwsh
        run: cargo build --release --target i686-pc-windows-msvc --bin pow

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item target\i686-pc-windows-msvc\release\pow.exe out\pow-windows-i386.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-i386
          path: out/pow-windows-i386.exe
          if-no-files-found: error

  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install native ARM64 Rust
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe' -OutFile rustup-init.exe
          .\rustup-init.exe -y --profile minimal --default-toolchain stable
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          rustup target add aarch64-pc-windows-msvc
          rustc -vV

      - name: Build
        shell: pwsh
        run: cargo build --release --target aarch64-pc-windows-msvc --bin pow

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item target\aarch64-pc-windows-msvc\release\pow.exe out\pow-windows-arm64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          path: out/*
          if-no-files-found: error

  build-freebsd:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            name: freebsd-amd64
    steps:
      - uses: actions/checkout@v7

      - name: Build in FreeBSD 15.1
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          usesh: true
          sync: rsync
          prepare: pkg install -y rust
          run: |
            set -eu
            cargo build --release --bin pow
            mkdir -p out
            cp target/release/pow out/pow-${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/pow-${{ matrix.name }}
          if-no-files-found: error

  build-freebsd-i386:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust for FreeBSD i386
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-freebsd

      - name: Install LLVM linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Download FreeBSD 15.1 i386 compatibility sysroot
        run: |
          curl --fail --location --retry 3 --output base.txz \
            https://download.freebsd.org/releases/amd64/amd64/15.1-RELEASE/base.txz
          curl --fail --location --retry 3 --output lib32.txz \
            https://download.freebsd.org/releases/amd64/amd64/15.1-RELEASE/lib32.txz
          mkdir -p freebsd-sysroot
          tar -xJf base.txz -C freebsd-sysroot
          tar -xJf lib32.txz -C freebsd-sysroot
          rm base.txz lib32.txz

      - name: Configure FreeBSD i386 cross-linker
        run: |
          cat > freebsd-i386-linker <<'EOF'
          #!/usr/bin/env bash
          set -e
          exec clang --target=i686-unknown-freebsd15.1 \
            --sysroot="$GITHUB_WORKSPACE/freebsd-sysroot" \
            -B"$GITHUB_WORKSPACE/freebsd-sysroot/usr/lib32" \
            -L"$GITHUB_WORKSPACE/freebsd-sysroot/usr/lib32" \
            -fuse-ld=lld "$@"
          EOF
          chmod +x freebsd-i386-linker
          echo "CARGO_TARGET_I686_UNKNOWN_FREEBSD_LINKER=$GITHUB_WORKSPACE/freebsd-i386-linker" >> "$GITHUB_ENV"

      - name: Build for FreeBSD i386
        run: cargo build --release --target i686-unknown-freebsd --bin pow

      - name: Verify architecture and package
        run: |
          binary="target/i686-unknown-freebsd/release/pow"
          readelf -h "$binary" | grep -E 'Class:|Machine:'
          readelf -h "$binary" | grep -q '80386'
          mkdir -p out
          cp "$binary" out/pow-freebsd-i386

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-i386
          path: out/pow-freebsd-i386
          if-no-files-found: error

  build-freebsd-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cross compile in FreeBSD 15.1 amd64 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: x86_64
          usesh: true
          sync: rsync
          prepare: pkg install -y curl ca_root_nss
          run: |
            set -eu
            curl -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup target add aarch64-unknown-freebsd

            export FREEBSD_SYSROOT="$(mktemp -d /tmp/freebsd-arm64-sysroot.XXXXXX)"
            curl --fail --location --retry 3 --output /tmp/freebsd-arm64-base.txz \
              https://download.freebsd.org/releases/arm64/aarch64/15.1-RELEASE/base.txz
            tar -xJf /tmp/freebsd-arm64-base.txz -C "$FREEBSD_SYSROOT"

            cat > /tmp/freebsd-arm64-linker <<'EOF'
            #!/bin/sh
            exec clang --target=aarch64-unknown-freebsd15.1 \
              --sysroot="$FREEBSD_SYSROOT" -fuse-ld=lld "$@"
            EOF
            chmod +x /tmp/freebsd-arm64-linker
            export CARGO_TARGET_AARCH64_UNKNOWN_FREEBSD_LINKER=/tmp/freebsd-arm64-linker

            cargo build --release --target aarch64-unknown-freebsd --bin pow
            binary=target/aarch64-unknown-freebsd/release/pow
            file "$binary"
            file "$binary" | grep -q 'aarch64'
            mkdir -p out
            cp "$binary" out/pow-freebsd-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-arm64
          path: out/pow-freebsd-arm64
          if-no-files-found: error

  build-freebsd-riscv64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cross compile in FreeBSD 15.1 amd64 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: x86_64
          usesh: true
          sync: rsync
          prepare: pkg install -y curl ca_root_nss
          run: |
            set -eu
            curl -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain nightly
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup component add rust-src --toolchain nightly

            export FREEBSD_SYSROOT="$(mktemp -d /tmp/freebsd-riscv64-sysroot.XXXXXX)"
            curl --fail --location --retry 3 --output /tmp/freebsd-riscv64-base.txz \
              https://download.freebsd.org/releases/riscv/riscv64/15.1-RELEASE/base.txz
            tar -xJf /tmp/freebsd-riscv64-base.txz -C "$FREEBSD_SYSROOT"

            cat > /tmp/freebsd-riscv64-linker <<'EOF'
            #!/bin/sh
            exec clang --target=riscv64-unknown-freebsd15.1 \
              --sysroot="$FREEBSD_SYSROOT" -fuse-ld=lld "$@"
            EOF
            chmod +x /tmp/freebsd-riscv64-linker
            export CARGO_TARGET_RISCV64GC_UNKNOWN_FREEBSD_LINKER=/tmp/freebsd-riscv64-linker

            cargo +nightly build --release \
              -Z build-std=std,panic_abort \
              --target riscv64gc-unknown-freebsd --bin pow
            binary=target/riscv64gc-unknown-freebsd/release/pow
            file "$binary"
            file "$binary" | grep -q 'RISC-V'
            mkdir -p out
            cp "$binary" out/pow-freebsd-riscv64

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-riscv64
          path: out/pow-freebsd-riscv64
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - build
      - build-linux-glibc
      - build-linux-i386
      - build-linux-riscv64-glibc
      - build-linux-musl
      - build-windows-i386
      - build-windows-arm64
      - build-freebsd
      - build-freebsd-i386
      - build-freebsd-arm64
      - build-freebsd-riscv64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: find dist -maxdepth 1 -type f -print

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
