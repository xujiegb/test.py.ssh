name: build

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-amd64
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            name: windows-amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}" --bin pow

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          extension=""
          if [[ "${{ matrix.os }}" == windows-* ]]; then extension=".exe"; fi
          cp "target/${{ matrix.target }}/release/pow${extension}" "out/pow-${{ matrix.name }}${extension}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  build-linux-cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: riscv64gc-unknown-linux-gnu
            name: linux-riscv64
          - target: powerpc64le-unknown-linux-gnu
            name: linux-ppc64le
          - target: i686-unknown-linux-gnu
            name: linux-i386
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --target "${{ matrix.target }}" --bin pow

      - name: Package
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/pow" "out/pow-${{ matrix.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  build-linux-musl:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            name: linux-amd64-musl
          - os: ubuntu-24.04
            platform: linux/386
            name: linux-i386-musl
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            name: linux-arm64-musl
    steps:
      - uses: actions/checkout@v7

      - name: Build in Alpine 3.22
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e RELEASE_NAME="${{ matrix.name }}" \
            alpine:3.22 sh -ec '
              apk add --no-cache build-base cargo rust
              rustc -vV
              cargo build --release --bin pow
              mkdir -p out
              cp target/release/pow "out/pow-$RELEASE_NAME"
              chmod +x "out/pow-$RELEASE_NAME"
            '

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/pow-${{ matrix.name }}
          if-no-files-found: error

  build-linux-riscv64-musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --locked

      - name: Cross compile Linux RISC-V64 musl
        run: cross build --release --target riscv64gc-unknown-linux-musl --bin pow

      - name: Package
        run: |
          mkdir -p out
          cp target/riscv64gc-unknown-linux-musl/release/pow out/pow-linux-riscv64-musl

      - uses: actions/upload-artifact@v7
        with:
          name: linux-riscv64-musl
          path: out/pow-linux-riscv64-musl
          if-no-files-found: error

  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install native ARM64 Rust
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe' -OutFile rustup-init.exe
          .\rustup-init.exe -y --profile minimal --default-toolchain stable
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          rustup target add aarch64-pc-windows-msvc
          rustc -vV

      - name: Build
        shell: pwsh
        run: cargo build --release --target aarch64-pc-windows-msvc --bin pow

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item target\aarch64-pc-windows-msvc\release\pow.exe out\pow-windows-arm64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          path: out/*
          if-no-files-found: error

  build-freebsd:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            name: freebsd-amd64
    steps:
      - uses: actions/checkout@v7

      - name: Build in FreeBSD 15.1
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          usesh: true
          sync: rsync
          prepare: pkg install -y rust
          run: |
            set -eu
            cargo build --release --bin pow
            mkdir -p out
            cp target/release/pow out/pow-${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/pow-${{ matrix.name }}
          if-no-files-found: error

  build-freebsd-i386:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust for FreeBSD i386
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-freebsd

      - name: Install LLVM linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Download FreeBSD 15.1 i386 compatibility sysroot
        run: |
          curl --fail --location --retry 3 --output base.txz \
            https://download.freebsd.org/releases/amd64/amd64/15.1-RELEASE/base.txz
          curl --fail --location --retry 3 --output lib32.txz \
            https://download.freebsd.org/releases/amd64/amd64/15.1-RELEASE/lib32.txz
          mkdir -p freebsd-sysroot
          tar -xJf base.txz -C freebsd-sysroot
          tar -xJf lib32.txz -C freebsd-sysroot
          rm base.txz lib32.txz

      - name: Configure FreeBSD i386 cross-linker
        run: |
          cat > freebsd-i386-linker <<'EOF'
          #!/usr/bin/env bash
          set -e
          exec clang --target=i686-unknown-freebsd15.1 \
            --sysroot="$GITHUB_WORKSPACE/freebsd-sysroot" \
            -B"$GITHUB_WORKSPACE/freebsd-sysroot/usr/lib32" \
            -L"$GITHUB_WORKSPACE/freebsd-sysroot/usr/lib32" \
            -fuse-ld=lld "$@"
          EOF
          chmod +x freebsd-i386-linker
          echo "CARGO_TARGET_I686_UNKNOWN_FREEBSD_LINKER=$GITHUB_WORKSPACE/freebsd-i386-linker" >> "$GITHUB_ENV"

      - name: Build for FreeBSD i386
        run: cargo build --release --target i686-unknown-freebsd --bin pow

      - name: Verify architecture and package
        run: |
          binary="target/i686-unknown-freebsd/release/pow"
          readelf -h "$binary" | grep -E 'Class:|Machine:'
          readelf -h "$binary" | grep -q '80386'
          mkdir -p out
          cp "$binary" out/pow-freebsd-i386

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-i386
          path: out/pow-freebsd-i386
          if-no-files-found: error

  build-freebsd-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust for FreeBSD ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-freebsd

      - name: Install LLVM linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Download FreeBSD 15.1 ARM64 sysroot
        run: |
          curl --fail --location --retry 3 --output base.txz \
            https://download.freebsd.org/releases/arm64/aarch64/15.1-RELEASE/base.txz
          mkdir -p freebsd-sysroot
          tar -xJf base.txz -C freebsd-sysroot
          rm base.txz

      - name: Configure FreeBSD ARM64 cross-linker
        run: |
          cat > freebsd-arm64-linker <<'EOF'
          #!/usr/bin/env bash
          set -e
          exec clang --target=aarch64-unknown-freebsd15.1 \
            --sysroot="$GITHUB_WORKSPACE/freebsd-sysroot" \
            -fuse-ld=lld "$@"
          EOF
          chmod +x freebsd-arm64-linker
          echo "CARGO_TARGET_AARCH64_UNKNOWN_FREEBSD_LINKER=$GITHUB_WORKSPACE/freebsd-arm64-linker" >> "$GITHUB_ENV"

      - name: Build for FreeBSD ARM64
        run: cargo build --release --target aarch64-unknown-freebsd --bin pow

      - name: Verify architecture and package
        run: |
          binary="target/aarch64-unknown-freebsd/release/pow"
          readelf -h "$binary" | grep -E 'Class:|Machine:'
          readelf -h "$binary" | grep -q 'AArch64'
          mkdir -p out
          cp "$binary" out/pow-freebsd-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-arm64
          path: out/pow-freebsd-arm64
          if-no-files-found: error

  build-freebsd-riscv64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly and its source
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install LLVM linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Download FreeBSD 15.1 RISC-V64 sysroot
        run: |
          curl --fail --location --retry 3 --output base.txz \
            https://download.freebsd.org/releases/riscv/riscv64/15.1-RELEASE/base.txz
          mkdir -p freebsd-sysroot
          tar -xJf base.txz -C freebsd-sysroot
          rm base.txz

      - name: Configure FreeBSD cross-linker
        run: |
          cat > freebsd-riscv64-linker <<'EOF'
          #!/usr/bin/env bash
          set -e
          exec clang --target=riscv64-unknown-freebsd15.1 \
            --sysroot="$GITHUB_WORKSPACE/freebsd-sysroot" \
            -fuse-ld=lld "$@"
          EOF
          chmod +x freebsd-riscv64-linker
          echo "CARGO_TARGET_RISCV64GC_UNKNOWN_FREEBSD_LINKER=$GITHUB_WORKSPACE/freebsd-riscv64-linker" >> "$GITHUB_ENV"

      - name: Build Rust std and pow for FreeBSD RISC-V64
        run: |
          cargo +nightly build --release \
            -Z build-std=std,panic_abort \
            --target riscv64gc-unknown-freebsd --bin pow

      - name: Verify architecture and package
        run: |
          binary="target/riscv64gc-unknown-freebsd/release/pow"
          readelf -h "$binary" | grep -E 'Class:|Machine:'
          readelf -h "$binary" | grep -q 'RISC-V'
          mkdir -p out
          cp "$binary" out/pow-freebsd-riscv64

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-riscv64
          path: out/pow-freebsd-riscv64
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - build
      - build-linux-cross
      - build-linux-musl
      - build-linux-riscv64-musl
      - build-windows-arm64
      - build-freebsd
      - build-freebsd-i386
      - build-freebsd-arm64
      - build-freebsd-riscv64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: find dist -maxdepth 1 -type f -print

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
